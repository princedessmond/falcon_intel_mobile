name: falcon_intel_mobile
description: Falcon Intel — Mobile threat intelligence companion app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # State management
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^13.0.0

  # Local storage
  shared_preferences: ^2.2.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  timeago: ^3.6.0

  # Utilities
  url_launcher: ^6.2.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  local_auth_platform_interface: ^1.1.0 # fake fingerprint sensor in tests
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
